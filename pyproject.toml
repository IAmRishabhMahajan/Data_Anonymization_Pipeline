[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-anonymizer"
version = "1.0.0"
description = "Anonymize personal data in CSV files: LLM-detected PII columns are replaced with realistic fake values. Header-less files get column names inferred first."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openai>=1.30",
    "chardet>=5.0",
    "faker>=24.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
data-anonymizer = "data_anonymizer.cli:main"

[tool.setuptools]
packages = ["data_anonymizer"]
